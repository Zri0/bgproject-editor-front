<div class="form-container">
  <form (ngSubmit)="onSave()">
    <!-- Basic information -->
    <fieldset>
      <legend>Basic Information</legend>

      <div class="form-group">
        <label for="title">Title *</label>
        <input
          type="text"
          id="title"
          [(ngModel)]="card.title"
          name="title"
          (change)="onCardChange()"
          required
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          [(ngModel)]="card.description"
          name="description"
          (change)="onCardChange()"
          rows="4"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="image">Image URL *</label>
        <input
          type="url"
          id="image"
          [(ngModel)]="card.image"
          name="image"
          (change)="onCardChange()"
          required
        />
      </div>
    </fieldset>

    <!-- Attributes -->
    <fieldset>
      <legend>Attributes</legend>

      <div class="form-row">
        <div class="form-group">
          <label for="level">Level</label>
          <select
            id="level"
            [(ngModel)]="card.level"
            name="level"
            (change)="onCardChange()"
          >
            <option *ngFor="let level of config.availableLevels" [value]="level">
              {{ level }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="health">Health</label>
          <input
            type="number"
            id="health"
            [(ngModel)]="card.health"
            name="health"
            (change)="onCardChange()"
            min="0"
          />
        </div>

        <div class="form-group">
          <label for="attack">Attack</label>
          <input
            type="number"
            id="attack"
            [(ngModel)]="card.attack"
            name="attack"
            (change)="onCardChange()"
            min="0"
          />
        </div>
      </div>
    </fieldset>

    <!-- Races -->
    <fieldset>
      <legend>Races</legend>

      <div class="form-group">
        <label>Selected races:</label>
        <div class="races-selected">
          <span *ngFor="let race of card.races" class="race-tag">
            {{ race }}
            <button
              type="button"
              (click)="removeRace(race)"
              class="btn-remove"
            >×</button>
          </span>
          <span *ngIf="card.races.length === 0" class="empty">No race selected</span>
        </div>
      </div>

      <div class="form-group">
        <label>Add race:</label>
        <div class="races-list">
          <button
            *ngFor="let race of config.availableRaces"
            type="button"
            (click)="addRace(race)"
            [disabled]="card.races.includes(race)"
            class="btn-secondary"
          >
            + {{ race }}
          </button>
        </div>
      </div>
    </fieldset>

    <!-- Buffs -->
    <fieldset>
      <legend>Applied Buffs</legend>

      <div *ngIf="card.appliedBuffs && card.appliedBuffs.length > 0" class="items-list">
        <div *ngFor="let buff of card.appliedBuffs" class="item">
          <div class="item-header">
            <strong>{{ getBuffName(buff.buff) }}</strong>
            <button
              type="button"
              (click)="removeBuff(buff)"
              class="btn-remove-item"
            >Remove</button>
          </div>
          <div class="item-params">
            <small *ngFor="let key of (buff.parameters | keyvalue)" class="param">
              {{ key.key }}: {{ key.value }}
            </small>
          </div>
        </div>
      </div>

      <div *ngIf="!card.appliedBuffs || card.appliedBuffs.length === 0" class="empty-message">
        No buffs applied
      </div>

      <!-- Add buff (only if the card is already saved) -->
      <div *ngIf="card.id" class="add-item">
        <div class="form-row">
          <div class="form-group">
            <label for="buffSelect">Select buff:</label>
            <select
              id="buffSelect"
              [(ngModel)]="selectedBuff"
              name="buffSelect"
              (change)="onBuffSelected()"
            >
              <option [value]="null">-- Select a buff --</option>
              <option *ngFor="let buff of config.availableBuffs" [value]="buff.id">
                {{ buff.name }}
              </option>
            </select>
          </div>
        </div>

        <!-- Buff parameters -->
        <div *ngIf="selectedBuffObj && selectedBuffObj.attributes.length > 0" class="params-section">
          <p class="section-title">Parameters:</p>
          <div class="form-row">
            <div
              *ngFor="let attr of selectedBuffObj.attributes"
              class="form-group"
            >
              <label>{{ attr.name }} ({{ attr.type }})</label>
              <input
                type="text"
                [(ngModel)]="tempBuffParameters[attr.name]"
                [name]="'buff_' + attr.name"
              />
            </div>
          </div>
        </div>

        <button
          type="button"
          (click)="addBuff()"
          [disabled]="!selectedBuff"
          class="btn-primary"
        >
          Add Buff
        </button>
      </div>
    </fieldset>

    <!-- Effects -->
    <fieldset>
      <legend>Contained Effects</legend>

      <div *ngIf="card.effects && card.effects.length > 0" class="items-list">
        <div *ngFor="let effect of card.effects" class="item">
          <div class="item-header">
            <strong>{{ getEffectName(effect.effect) }}</strong>
            <button
              type="button"
              (click)="removeEffect(effect)"
              class="btn-remove-item"
            >Remove</button>
          </div>
          <div class="item-params">
            <small *ngFor="let key of (effect.parameters | keyvalue)" class="param">
              {{ key.key }}: {{ key.value }}
            </small>
          </div>
        </div>
      </div>

      <div *ngIf="!card.effects || card.effects.length === 0" class="empty-message">
        No effects contained
      </div>

      <!-- Add effect (only if the card is already saved) -->
      <div *ngIf="card.id" class="add-item">
        <div class="form-row">
          <div class="form-group">
            <label for="effectSelect">Select effect:</label>
            <select
              id="effectSelect"
              [(ngModel)]="selectedEffect"
              name="effectSelect"
              (change)="onEffectSelected()"
            >
              <option [value]="null">-- Select an effect --</option>
              <option *ngFor="let effect of config.availableEffects" [value]="effect.id">
                {{ effect.name }}
              </option>
            </select>
          </div>
        </div>

        <!-- Effect parameters -->
        <div *ngIf="selectedEffectObj && selectedEffectObj.attributes.length > 0" class="params-section">
          <p class="section-title">Parameters:</p>
          <div class="form-row">
            <div
              *ngFor="let attr of selectedEffectObj.attributes"
              class="form-group"
            >
              <label>{{ attr.name }} ({{ attr.type }})</label>
              <input
                type="text"
                [(ngModel)]="tempEffectParameters[attr.name]"
                [name]="'effect_' + attr.name"
              />
            </div>
          </div>
        </div>

        <button
          type="button"
          (click)="addEffect()"
          [disabled]="!selectedEffect"
          class="btn-primary"
        >
          Add Effect
        </button>
      </div>
    </fieldset>

    <!-- Save button -->
    <div class="form-actions">
      <button
        type="submit"
        class="btn-save"
        [disabled]="saving"
      >
        {{ saving ? 'Saving...' : 'Save Card' }}
      </button>
    </div>
  </form>
</div>
