<div class="editor-container">
  <h1>Card Editor</h1>

  <div *ngIf="loading" class="loading">
    Loading...
  </div>

  <div *ngIf="error" class="error-message">
    <strong>Error:</strong> {{ error }}
  </div>

  <div *ngIf="warning" class="warning-message">
    <strong>Heads up:</strong> {{ warning }}
  </div>

  <div *ngIf="!loading && config && card" class="editor-layout">
    <div class="editor-left">
      <app-form
        [card]="card"
        [config]="config"
        (cardChanged)="onCardChanged($event)"
        (save)="onSave($event)"
        [saving]="saving"
      ></app-form>
    </div>

    <div class="editor-right">
      <app-preview [card]="card" [config]="config"></app-preview>
    </div>
  </div>
</div>
